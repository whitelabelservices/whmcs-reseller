<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opening console...</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e293b;
            color: #e2e8f0;
        }
        .box { text-align: center; padding: 2rem; }
        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 1rem;
            border: 3px solid rgba(129, 140, 248, 0.25);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #f87171; max-width: 420px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner" id="spinner"></div>
        <div id="message">Opening console...</div>
    </div>
    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var ticket = params.get('ticket');
        var csrf = params.get('csrf');
        var redirect = params.get('redirect');
        var message = document.getElementById('message');
        var spinner = document.getElementById('spinner');

        function fail(text) {
            spinner.style.display = 'none';
            message.className = 'error';
            message.textContent = text;
        }

        if (!ticket || !redirect) {
            fail('Invalid console launch link.');
            return;
        }

        try {
            var secure = window.location.protocol === 'https:';
            var base = 'path=/; SameSite=Lax' + (secure ? '; Secure' : '');

            document.cookie = 'PVEAuthCookie=' + ticket + '; ' + base;
            if (csrf) {
                document.cookie = 'CSRFPreventionToken=' + csrf + '; ' + base;
            }

            window.location.replace(redirect);
        } catch (e) {
            fail('Could not start console: ' + (e.message || 'unknown error'));
        }
    })();
    </script>
</body>
</html>
